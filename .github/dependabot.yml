version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 4
    # Group routine updates; major upgrades remain separate for review.
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
      provider-sdks:
        patterns:
          - "@anthropic-ai/claude-agent-sdk"
          - "@modelcontextprotocol/sdk"
          - zod
        update-types: [minor, patch]
      terminal-runtime:
        patterns:
          - "@xterm/*"
          - node-pty
          - ws
        update-types: [minor, patch]
      development-tools:
        patterns:
          - "@types/*"
          - typescript
        update-types: [minor, patch]
      other-npm-updates:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    groups:
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
      actions-routine:
        patterns: ["*"]
        update-types: [minor, patch]
